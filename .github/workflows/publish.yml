name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.12'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked --group release
      - name: Check release tag matches package version
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must match pyproject.toml"
          PY
      - run: uv build
      - run: uv run --group release twine check --strict dist/*
      - run: uv run python validation/wheel_smoke.py --wheel dist/cancellens-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cancellens/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
